<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 鞍点 · SGD vs 动量法 (无自动旋转)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a26;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .card {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 24px 22px 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8);
        }
        h1 {
            font-weight: 600;
            font-size: 1.6rem;
            color: #e8f0f8;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 0.95rem;
            font-weight: 400;
            color: #8ab4d6;
            background: rgba(138, 180, 214, 0.12);
            padding: 4px 18px;
            border-radius: 40px;
        }
        .sub {
            color: #9bb8d4;
            font-size: 0.95rem;
            padding-left: 14px;
            margin-bottom: 18px;
            border-left: 3px solid #3a7ca5;
            padding-left: 18px;
            background: rgba(58, 124, 165, 0.06);
            border-radius: 0 12px 12px 0;
            line-height: 1.6;
        }
        .canvas-wrap {
            background: #0f1f2b;
            border-radius: 28px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.4);
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 20px;
            background: #0b1a26;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px 44px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #c8dce8;
            font-size: 0.9rem;
            font-weight: 450;
        }
        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255,255,255,0.08);
        }
        .footnote {
            text-align: center;
            color: #7fa3be;
            font-size: 0.85rem;
            margin-top: 14px;
            background: rgba(255,255,255,0.03);
            padding: 10px 20px;
            border-radius: 40px;
            display: inline-block;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.04);
        }
        @media (max-width: 680px) {
            .card { padding: 16px; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        🧊 鞍点可视化 · SGD vs 动量法
        <small>3D 损失曲面 · 无自动旋转</small>
    </h1>
    <div class="sub">
        <strong>红色路径：</strong>SGD 在鞍点（中间平坦区域）被困 &nbsp;|&nbsp; <strong>蓝色路径：</strong>动量法利用速度积累冲过鞍点
    </div>
    <div class="canvas-wrap">
        <canvas id="canvas3d" width="1000" height="600"></canvas>
    </div>
    <div class="legend">
        <span class="legend-item"><span class="color-dot" style="background:#e74c3c; box-shadow: 0 0 16px #e74c3c55;"></span> SGD (被困)</span>
        <span class="legend-item"><span class="color-dot" style="background:#3498db; box-shadow: 0 0 16px #3498db55;"></span> 动量法 (穿越)</span>
        <span class="legend-item"><span class="color-dot" style="background:#f1c40f; box-shadow: 0 0 16px #f1c40f55;"></span> 鞍点 (梯度 ≈ 0)</span>
        <span class="legend-item"><span style="color:#8ab4d6;">🖱 拖拽旋转 · 滚轮缩放</span></span>
    </div>
    <div style="text-align: center;">
        <span class="footnote">⚡ 动量法 = 速度惯性 · 即使梯度消失也能保持方向冲过鞍点</span>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('canvas3d');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        // ---------- 3D 参数 ----------
        let rotX = 0.35, rotY = -0.6;
        let zoom = 1.0;
        let isDragging = false, prevMouse = {x:0, y:0};

        // ---------- 鞍点函数 ----------
        function f(x, y) {
            return x*x - y*y + 0.3 * Math.sin(x*1.8) * Math.cos(y*1.8);
        }

        function gradF(x, y) {
            return {
                dx: 2*x + 0.3 * 1.8 * Math.cos(x*1.8) * Math.cos(y*1.8),
                dy: -2*y - 0.3 * 1.8 * Math.sin(x*1.8) * Math.sin(y*1.8)
            };
        }

        // ---------- 3D 投影 ----------
        function project(x, y, z) {
            const scale = 70 * zoom;
            const cx = W/2, cy = H/2 - 30;
            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            let y1 = y * cosX - z * sinX;
            let z1 = y * sinX + z * cosX;
            let x2 = x * cosY + z1 * sinY;
            let z2 = -x * sinY + z1 * cosY;
            return { x: cx + x2 * scale, y: cy - y1 * scale + z2 * 0.15 * scale, z: z2 };
        }

        // ---------- 绘制 ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);
            const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
            grad.addColorStop(0, '#132835');
            grad.addColorStop(1, '#09141e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            const range = 2.2;
            const steps = 35;
            const step = (2 * range) / steps;

            const vertices = [];
            for (let i = 0; i <= steps; i++) {
                const x = -range + i * step;
                for (let j = 0; j <= steps; j++) {
                    const y = -range + j * step;
                    const z = f(x, y);
                    const p = project(x, y, z);
                    const t = (z + 4.5) / 9.0;
                    const r = 0.2 + 0.8 * t;
                    const g = 0.3 + 0.5 * (1 - Math.abs(t - 0.5) * 2);
                    const b = 0.8 - 0.7 * t;
                    const bright = 0.5 + 0.5 * (1 - (z + 4.5) / 9.0);
                    vertices.push({ px: p.x, py: p.y, pz: p.z, x, y, z, r, g, b, i, j });
                }
            }
            vertices.sort((a, b) => b.pz - a.pz);

            const gridMap = {};
            vertices.forEach(v => { gridMap[v.i+','+v.j] = v; });

            for (let i = 0; i < steps; i++) {
                for (let j = 0; j < steps; j++) {
                    const v00 = gridMap[i+','+j];
                    const v10 = gridMap[(i+1)+','+j];
                    const v11 = gridMap[(i+1)+','+(j+1)];
                    const v01 = gridMap[i+','+(j+1)];
                    if (!v00 || !v10 || !v11 || !v01) continue;
                    const avgZ = (v00.pz + v10.pz + v11.pz + v01.pz) / 4;
                    ctx.beginPath();
                    ctx.moveTo(v00.px, v00.py);
                    ctx.lineTo(v10.px, v10.py);
                    ctx.lineTo(v11.px, v11.py);
                    ctx.lineTo(v01.px, v01.py);
                    ctx.closePath();
                    const avgR = (v00.r + v10.r + v11.r + v01.r) / 4;
                    const avgG = (v00.g + v10.g + v11.g + v01.g) / 4;
                    const avgB = (v00.b + v10.b + v11.b + v01.b) / 4;
                    const bright = 0.4 + 0.6 * (1 - Math.abs(avgZ) / 8);
                    ctx.fillStyle = `rgb(${Math.floor(avgR*200*bright)}, ${Math.floor(avgG*180*bright)}, ${Math.floor(avgB*200*bright)})`;
                    ctx.fill();
                    ctx.strokeStyle = `rgba(255,255,255,${0.04 + 0.06 * (1 - Math.abs(avgZ)/6)})`;
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }
            }

            // 鞍点
            const sp = project(0, 0, f(0,0));
            ctx.shadowColor = '#f1c40f';
            ctx.shadowBlur = 28;
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, 8, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 13px "Segoe UI", sans-serif';
            ctx.fillText('鞍点', sp.x + 16, sp.y + 5);

            // 模拟轨迹
            function simulateMomentum(startX, startY, lr, momentum, steps, isMomentum) {
                let x = startX, y = startY;
                let vx = 0, vy = 0;
                const path = [];
                for (let i = 0; i < steps; i++) {
                    const g = gradF(x, y);
                    if (isMomentum) {
                        vx = momentum * vx + lr * g.dx;
                        vy = momentum * vy + lr * g.dy;
                    } else {
                        vx = lr * g.dx;
                        vy = lr * g.dy;
                    }
                    x -= vx;
                    y -= vy;
                    if (Math.abs(x) > 3.5 || Math.abs(y) > 3.5) break;
                    path.push({ x, y, z: f(x,y) });
                }
                return path;
            }

            const sgdPath = simulateMomentum(-1.6, 1.2, 0.12, 0.0, 80, false);
            const momPath = simulateMomentum(-1.6, 1.2, 0.08, 0.9, 80, true);

            function drawPath3D(path, color, lineWidth, glowColor) {
                if (path.length < 2) return;
                const pts = path.map(p => project(p.x, p.y, p.z));
                if (glowColor) {
                    ctx.shadowColor = glowColor;
                    ctx.shadowBlur = 22;
                }
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
                ctx.shadowBlur = 0;
                for (let i = 0; i < pts.length; i+=2) {
                    const alpha = 0.3 + 0.7 * (i / pts.length);
                    const radius = 2 + 3 * (i / pts.length);
                    ctx.beginPath();
                    ctx.arc(pts[i].x, pts[i].y, radius, 0, Math.PI*2);
                    ctx.fillStyle = color.replace(')', `,${alpha})`).replace('rgb', 'rgba');
                    ctx.fill();
                }
                const last = pts[pts.length-1];
                ctx.shadowColor = color;
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(last.x, last.y, 6, 0, Math.PI*2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            drawPath3D(sgdPath, 'rgb(231, 76, 60)', 3.2, 'rgba(231,76,60,0.5)');
            drawPath3D(momPath, 'rgb(52, 152, 219)', 3.8, 'rgba(52,152,219,0.6)');

            const startPt = project(-1.6, 1.2, f(-1.6, 1.2));
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ecf0f1';
            ctx.font = '12px "Segoe UI", sans-serif';
            ctx.fillText('起点', startPt.x - 30, startPt.y - 16);

            // 内嵌图例
            ctx.font = '13px "Segoe UI", sans-serif';
            ctx.fillStyle = '#e74c3c';
            ctx.fillText('● SGD 被困', 30, 40);
            ctx.fillStyle = '#3498db';
            ctx.fillText('● 动量法 穿越', 30, 66);
            ctx.fillStyle = '#f1c40f';
            ctx.fillText('● 鞍点', 30, 92);
        }

        // ---------- 交互 ----------
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            prevMouse.x = (e.clientX - rect.left) * scaleX;
            prevMouse.y = (e.clientY - rect.top) * scaleY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            const dx = mx - prevMouse.x;
            const dy = my - prevMouse.y;
            rotY += dx * 0.008;
            rotX += dy * 0.008;
            rotX = Math.max(-1.2, Math.min(1.2, rotX));
            prevMouse.x = mx;
            prevMouse.y = my;
            draw();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.08 : 0.08;
            zoom = Math.max(0.4, Math.min(1.8, zoom + delta));
            draw();
        }, { passive: false });

        // 触摸支持
        let touchDist = 0;
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                isDragging = true;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                prevMouse.x = (e.touches[0].clientX - rect.left) * scaleX;
                prevMouse.y = (e.touches[0].clientY - rect.top) * scaleY;
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchDist = Math.sqrt(dx*dx + dy*dy);
            }
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const mx = (e.touches[0].clientX - rect.left) * scaleX;
                const my = (e.touches[0].clientY - rect.top) * scaleY;
                const dx = mx - prevMouse.x;
                const dy = my - prevMouse.y;
                rotY += dx * 0.008;
                rotX += dy * 0.008;
                rotX = Math.max(-1.2, Math.min(1.2, rotX));
                prevMouse.x = mx;
                prevMouse.y = my;
                draw();
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const delta = (dist - touchDist) * 0.005;
                zoom = Math.max(0.4, Math.min(1.8, zoom + delta));
                touchDist = dist;
                draw();
            }
        }, { passive: false });
        canvas.addEventListener('touchend', () => { isDragging = false; });

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const aspect = 1000 / 600;
            const w = rect.width;
            const h = w / aspect;
            canvas.style.height = h + 'px';
        }
        window.addEventListener('resize', resizeCanvas);

        resizeCanvas();
        draw();
    })();
</script>
</body>
</html>

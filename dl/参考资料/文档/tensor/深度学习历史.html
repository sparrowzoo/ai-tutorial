<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深度学习历史图谱 · 含辛顿家族传承</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; user-select: none; }
        body { background: #f0f3f9; display: flex; justify-content: center; padding: 24px 16px; min-height: 100vh; }
        .container { max-width: 1400px; width: 100%; background: white; border-radius: 40px; box-shadow: 0 20px 50px rgba(0,20,40,0.12); padding: 24px 20px 40px; }
        h1 { font-size: 2rem; font-weight: 650; color: #0b1c33; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
        .subtitle { color: #3b4a5e; border-left: 4px solid #3b82f6; padding-left: 20px; margin-bottom: 18px; background: #f0f6ff; border-radius: 0 16px 16px 0; padding: 10px 22px; font-weight: 400; line-height: 1.6; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-bottom: 18px; padding: 8px 4px; }
        .legend { display: flex; flex-wrap: wrap; gap: 14px 28px; background: #f8fafc; padding: 8px 20px; border-radius: 60px; border: 1px solid #e2e8f0; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 500; color: #1e293b; }
        .legend-line { width: 28px; height: 3px; border-radius: 6px; }
        .legend-line.origin { background: #6c5ce7; }
        .legend-line.early { background: #00b894; }
        .legend-line.breakthrough { background: #fdcb6e; }
        .legend-line.modern { background: #e17055; }
        .legend-line.heritage { background: #8b5cf6; }

        .graph-container { position: relative; width: 100%; height: 1400px; background: #fafcff; border-radius: 28px; border: 1px solid #e9edf4; overflow: hidden; touch-action: none; }
        #graphSvg { display: block; width: 100%; height: 100%; background: #fafcff; cursor: grab; }
        #graphSvg:active { cursor: grabbing; }

        .node-group { cursor: grab; }
        .node-group:active { cursor: grabbing; }
        .node-bg { fill: white; stroke: #dce3ef; stroke-width: 1.8; rx: 20; ry: 20; transition: stroke 0.2s, filter 0.2s; }
        .node-group:hover .node-bg { stroke: #3b82f6; filter: drop-shadow(0 4px 12px rgba(0,20,40,0.12)); }
        .node-bg-heritage { fill: #f3f0ff; stroke: #8b5cf6; stroke-width: 2; rx: 20; ry: 20; transition: stroke 0.2s, filter 0.2s; }
        .node-group:hover .node-bg-heritage { stroke: #6d28d9; filter: drop-shadow(0 4px 12px rgba(0,20,40,0.12)); }

        .node-year { font-size: 12px; font-weight: 800; fill: #0b1c33; text-anchor: middle; pointer-events: none; }
        .node-title { font-size: 9px; font-weight: 700; fill: #1e293b; text-anchor: middle; pointer-events: none; }
        .node-name-cn { font-size: 8.5px; font-weight: 600; fill: #2d3748; text-anchor: middle; pointer-events: none; }
        .node-desc { font-size: 7px; fill: #5e6f87; text-anchor: middle; pointer-events: none; }
        .node-problem { font-size: 6.5px; fill: #e17055; text-anchor: middle; pointer-events: none; font-weight: 600; }

        .edge { stroke-width: 2; fill: none; stroke-linecap: round; opacity: 0.6; }
        .edge-origin { stroke: #6c5ce7; stroke-dasharray: 4 4; }
        .edge-early { stroke: #00b894; stroke-dasharray: 5 5; }
        .edge-breakthrough { stroke: #fdcb6e; stroke-dasharray: 6 4; }
        .edge-modern { stroke: #e17055; stroke-dasharray: 4 6; }
        .edge-heritage { stroke: #8b5cf6; stroke-dasharray: 3 6; stroke-width: 2.5; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 20, 40, 0.4);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            border-radius: 40px;
            padding: 32px 36px 36px 36px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            animation: modalFade 0.25s ease;
            overflow-y: auto;
            position: relative;
        }

        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.95) translateY(16px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: #f1f5f9;
            border: none;
            border-radius: 60px;
            width: 42px;
            height: 42px;
            font-size: 1.2rem;
            cursor: pointer;
            color: #1e293b;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .modal-close:hover { background: #e2e8f0; transform: rotate(90deg); }

        .modal-header {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 18px;
            padding-right: 50px;
        }

        .modal-label {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            flex-shrink: 0;
            color: white;
        }

        .modal-name { font-size: 1.4rem; font-weight: 700; color: #0b1c33; line-height: 1.3; }
        .modal-name .cn { font-weight: 400; color: #475569; margin-left: 8px; }
        .modal-year { font-size: 1rem; font-weight: 400; color: #6b7b93; margin-left: 10px; }
        .modal-meta { color: #475569; font-size: 0.95rem; margin-top: 2px; }
        .modal-bio { border-top: 1px solid #e9edf4; padding-top: 20px; line-height: 1.8; color: #1e293b; font-size: 0.95rem; }
        .modal-bio i { color: #2563eb; width: 24px; }
        .modal-bio .highlight { background: #fef9c3; padding: 0 4px; font-weight: 600; }
        .modal-bio .org { display: inline-block; background: #eef3fa; padding: 0 12px; border-radius: 30px; font-size: 0.8rem; font-weight: 500; }
        .modal-bio .paper { display: block; background: #f1f5f9; padding: 6px 14px; border-radius: 10px; margin: 6px 0; font-size: 0.85rem; border-left: 3px solid #2563eb; }
        .modal-bio .paper .en { font-weight: 500; color: #0b1c33; }
        .modal-bio .paper .cn { color: #475569; font-size: 0.8rem; }
        .modal-bio .problem { background: #fef2f2; padding: 8px 14px; border-radius: 10px; margin: 8px 0; border-left: 3px solid #e17055; font-size: 0.9rem; }
        .modal-bio .problem strong { color: #e17055; }
        .modal-bio p { margin-bottom: 8px; }

        .modal-bio::-webkit-scrollbar { width: 6px; }
        .modal-bio::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .modal-bio::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @media (max-width:700px) {
            .container { padding:12px; }
            h1 { font-size:1.4rem; }
            .graph-container { height:1100px; }
            .legend { gap:8px 16px; padding:6px 14px; }
            .modal { padding: 24px 20px; max-width: 100%; }
            .modal-header { flex-wrap: wrap; gap: 12px; }
            .modal-name { font-size: 1.2rem; }
            .modal-label { width: 56px; height: 56px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1><span>📄 深度学习历史图谱</span><span style="font-size:1rem;font-weight:400;color:#3b4a5e;margin-left:6px;">含辛顿家族传承 · 中英对照</span></h1>
    <div class="subtitle"><i class="fas fa-arrows-alt"></i> 拖拽节点 → 连线自动跟随 · 紫色虚线 = 家族传承 · 点击查看详情</div>
    <div class="toolbar">
        <div class="legend">
            <span class="legend-item"><span class="legend-line origin"></span> 起源 · 1943-1960</span>
            <span class="legend-item"><span class="legend-line early"></span> 早期探索 · 1969-1974</span>
            <span class="legend-item"><span class="legend-line breakthrough"></span> 突破 · 1986-2006</span>
            <span class="legend-item"><span class="legend-line modern"></span> 现代 · 2012-2016</span>
            <span class="legend-item"><span class="legend-line heritage"></span> 家族传承</span>
        </div>
        <div style="margin-left:auto;font-size:.8rem;color:#6b7b93;"><i class="fas fa-sync-alt"></i> 双击空白重置</div>
    </div>

    <div class="graph-container" id="graphContainer">
        <svg id="graphSvg" viewBox="0 0 1450 1400" preserveAspectRatio="xMidYMid meet">
            <defs>
                <marker id="arrowOrigin" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c5ce7"/></marker>
                <marker id="arrowEarly" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00b894"/></marker>
                <marker id="arrowBreakthrough" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fdcb6e"/></marker>
                <marker id="arrowModern" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e17055"/></marker>
                <marker id="arrowHeritage" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/></marker>
            </defs>
            <g id="edgesGroup"></g>
            <g id="nodesGroup">

                <!-- ===== 家族传承节点（新增） ===== -->
                <!-- 乔治·布尔 1815-1864 -->
                <g class="node-group" data-person="boole" data-id="boole" transform="translate(80, 40)">
                    <rect class="node-bg-heritage" x="-110" y="-60" width="220" height="100" />
                    <text class="node-year" x="0" y="-32" style="fill:#8b5cf6;">1815-1864</text>
                    <text class="node-title" x="0" y="-14">George Boole</text>
                    <text class="node-name-cn" x="0" y="0">乔治·布尔</text>
                    <text class="node-desc" x="0" y="16">布尔代数 · 计算机数学基础</text>
                    <text class="node-desc" x="0" y="30" font-size="6.5" fill="#8b5cf6">辛顿的高曾祖父</text>
                </g>

                <!-- 乔治·埃佛勒斯 1790-1866 -->
                <g class="node-group" data-person="everest" data-id="everest" transform="translate(340, 40)">
                    <rect class="node-bg-heritage" x="-110" y="-60" width="220" height="100" />
                    <text class="node-year" x="0" y="-32" style="fill:#8b5cf6;">1790-1866</text>
                    <text class="node-title" x="0" y="-14">George Everest</text>
                    <text class="node-name-cn" x="0" y="0">乔治·埃佛勒斯</text>
                    <text class="node-desc" x="0" y="16">测绘学家 · 珠峰命名来源</text>
                    <text class="node-desc" x="0" y="30" font-size="6.5" fill="#8b5cf6">辛顿高祖母的叔叔</text>
                </g>

                <!-- 琼·辛顿（寒春）1921-2010 -->
                <g class="node-group" data-person="joan" data-id="joan" transform="translate(600, 40)">
                    <rect class="node-bg-heritage" x="-110" y="-60" width="220" height="100" />
                    <text class="node-year" x="0" y="-32" style="fill:#8b5cf6;">1921-2010</text>
                    <text class="node-title" x="0" y="-14">Joan Hinton（寒春）</text>
                    <text class="node-name-cn" x="0" y="0">琼·辛顿</text>
                    <text class="node-desc" x="0" y="16">核物理学家 · 曼哈顿计划</text>
                    <text class="node-desc" x="0" y="30" font-size="6.5" fill="#8b5cf6">辛顿的姑姑</text>
                </g>

                <!-- 霍华德·辛顿 1912-1977 -->
                <g class="node-group" data-person="howard" data-id="howard" transform="translate(860, 40)">
                    <rect class="node-bg-heritage" x="-110" y="-60" width="220" height="100" />
                    <text class="node-year" x="0" y="-32" style="fill:#8b5cf6;">1912-1977</text>
                    <text class="node-title" x="0" y="-14">Howard Hinton</text>
                    <text class="node-name-cn" x="0" y="0">霍华德·辛顿</text>
                    <text class="node-desc" x="0" y="16">昆虫学家 · 英国皇家学会会员</text>
                    <text class="node-desc" x="0" y="30" font-size="6.5" fill="#8b5cf6">辛顿的父亲</text>
                </g>

                <!-- ===== 深度学习历史节点（原有，下移） ===== -->
                <!-- 1943 · McCulloch & Pitts -->
                <g class="node-group" data-person="mcculloch" data-id="mcculloch" transform="translate(80, 250)">
                    <rect class="node-bg" x="-100" y="-55" width="200" height="90" />
                    <text class="node-year" x="0" y="-28" style="fill:#6c5ce7;">1943</text>
                    <text class="node-title" x="0" y="-12">McCulloch &amp; Pitts</text>
                    <text class="node-name-cn" x="0" y="2">麦卡洛克 &amp; 皮茨</text>
                    <text class="node-desc" x="0" y="16">神经网络计算模型</text>
                    <text class="node-problem" x="0" y="32">❓ 如何用数学模拟神经元？</text>
                </g>

                <!-- 1957 · Rosenblat -->
                <g class="node-group" data-person="rosenblat" data-id="rosenblat" transform="translate(320, 250)">
                    <rect class="node-bg" x="-100" y="-55" width="200" height="90" />
                    <text class="node-year" x="0" y="-28" style="fill:#6c5ce7;">1957</text>
                    <text class="node-title" x="0" y="-12">Frank Rosenblatt</text>
                    <text class="node-name-cn" x="0" y="2">弗兰克·罗森布拉特</text>
                    <text class="node-desc" x="0" y="16">感知机 · Perceptron</text>
                    <text class="node-problem" x="0" y="32">❓ 如何让机器自动学习？</text>
                </g>

                <!-- 1960 · Widrow & Hoff -->
                <g class="node-group" data-person="widrow" data-id="widrow" transform="translate(560, 250)">
                    <rect class="node-bg" x="-100" y="-55" width="200" height="90" />
                    <text class="node-year" x="0" y="-28" style="fill:#6c5ce7;">1960</text>
                    <text class="node-title" x="0" y="-12">Widrow &amp; Hoff</text>
                    <text class="node-name-cn" x="0" y="2">威德罗 &amp; 霍夫</text>
                    <text class="node-desc" x="0" y="16">Adaline/Madaline</text>
                    <text class="node-problem" x="0" y="32">❓ 如何叠加多层线性单元？</text>
                </g>

                <!-- 1969 · Minsky & Papert -->
                <g class="node-group" data-person="minsky" data-id="minsky" transform="translate(800, 250)">
                    <rect class="node-bg" x="-100" y="-55" width="200" height="90" />
                    <text class="node-year" x="0" y="-28" style="fill:#00b894;">1969</text>
                    <text class="node-title" x="0" y="-12">Minsky &amp; Papert</text>
                    <text class="node-name-cn" x="0" y="2">明斯基 &amp; 帕珀特</text>
                    <text class="node-desc" x="0" y="16">"Perceptrons"</text>
                    <text class="node-problem" x="0" y="32">❓ 单层网络为何失效？</text>
                </g>

                <!-- 1974 · Paul Werbos -->
                <g class="node-group" data-person="werbos" data-id="werbos" transform="translate(1040, 250)">
                    <rect class="node-bg" x="-100" y="-55" width="200" height="90" />
                    <text class="node-year" x="0" y="-28" style="fill:#00b894;">1974</text>
                    <text class="node-title" x="0" y="-12">Paul Werbos</text>
                    <text class="node-name-cn" x="0" y="2">保罗·韦伯斯</text>
                    <text class="node-desc" x="0" y="16">反向传播算法</text>
                    <text class="node-problem" x="0" y="32">❓ 如何训练多层网络？</text>
                </g>

                <!-- 1986 · Rumelhart, Hinton, Williams -->
                <g class="node-group" data-person="rumelhart" data-id="rumelhart" transform="translate(160, 440)">
                    <rect class="node-bg" x="-110" y="-55" width="220" height="90" />
                    <text class="node-year" x="0" y="-28" style="fill:#fdcb6e;">1986</text>
                    <text class="node-title" x="0" y="-14">Rumelhart · Hinton · Williams</text>
                    <text class="node-name-cn" x="0" y="0">鲁梅尔哈特 · 辛顿 · 威廉姆斯</text>
                    <text class="node-desc" x="0" y="14">反向传播 · 推广</text>
                    <text class="node-problem" x="0" y="30">❓ 如何让学术界接受BP？</text>
                </g>

                <!-- 1989 · Yann LeCun -->
                <g class="node-group" data-person="lecun1989" data-id="lecun1989" transform="translate(430, 440)">
                    <rect class="node-bg" x="-100" y="-55" width="200" height="90" />
                    <text class="node-year" x="0" y="-28" style="fill:#fdcb6e;">1989</text>
                    <text class="node-title" x="0" y="-12">Yann LeCun</text>
                    <text class="node-name-cn" x="0" y="2">杨立昆</text>
                    <text class="node-desc" x="0" y="16">LeNet · 卷积神经网络</text>
                    <text class="node-problem" x="0" y="32">❓ 如何高效处理图像？</text>
                </g>

                <!-- 2006 · Hinton, Salakhutdinov, Osindero -->
                <g class="node-group" data-person="hinton2006" data-id="hinton2006" transform="translate(700, 440)">
                    <rect class="node-bg" x="-110" y="-55" width="220" height="90" />
                    <text class="node-year" x="0" y="-28" style="fill:#fdcb6e;">2006</text>
                    <text class="node-title" x="0" y="-14">Hinton · Salakhutdinov · Osindero</text>
                    <text class="node-name-cn" x="0" y="0">辛顿 · 萨拉赫丁诺夫 · 奥辛德罗</text>
                    <text class="node-desc" x="0" y="14">深度信念网络</text>
                    <text class="node-problem" x="0" y="30">❓ 如何让"深度"再次可行？</text>
                </g>

                <!-- 2012 · AlexNet -->
                <g class="node-group" data-person="alexnet" data-id="alexnet" transform="translate(970, 440)">
                    <rect class="node-bg" x="-110" y="-55" width="220" height="90" />
                    <text class="node-year" x="0" y="-28" style="fill:#e17055;">2012</text>
                    <text class="node-title" x="0" y="-14">Krizhevsky · Sutskever · Hinton</text>
                    <text class="node-name-cn" x="0" y="0">克里热夫斯基 · 苏茨克维 · 辛顿</text>
                    <text class="node-desc" x="0" y="14">AlexNet · ImageNet 冠军</text>
                    <text class="node-problem" x="0" y="30">❓ 如何在大数据上训练深度网络？</text>
                </g>

                <!-- 2013-2016 · ImageNet Era -->
                <g class="node-group" data-person="imagenet" data-id="imagenet" transform="translate(1240, 440)">
                    <rect class="node-bg" x="-100" y="-55" width="200" height="90" />
                    <text class="node-year" x="0" y="-28" style="fill:#e17055;">2013-2016</text>
                    <text class="node-title" x="0" y="-12">ImageNet 时代</text>
                    <text class="node-name-cn" x="0" y="2">ImageNet 时代</text>
                    <text class="node-desc" x="0" y="16">GoogLeNet · VGG · ResNet · SENet</text>
                    <text class="node-problem" x="0" y="32">❓ 如何让模型更深更强？</text>
                </g>

                <!-- ===== 底部完整结论卡片 ===== -->
                <g transform="translate(80, 740)">
                    <rect x="0" y="0" width="1290" height="440" rx="18" fill="#fef9e7" stroke="#e17055" stroke-width="2" />
                    <text x="30" y="40" font-size="20" font-weight="700" fill="#e17055">💎 核心结论：为什么辛顿贡献这么大？</text>

                    <text x="30" y="75" font-size="14" fill="#1e293b" font-weight="600">❓ 反向传播算法和链式求导法则都不是辛顿发明的——但他的贡献是另一维度的。</text>

                    <text x="30" y="108" font-size="13.5" fill="#2d3748">📌 他不是"发明者"，而是"推广者"和"坚守者"</text>
                    <text x="50" y="130" font-size="12.5" fill="#4a5568">• 1986年《自然》论文让反向传播从"冷门博士论文"变成"整个领域的标准工具"</text>
                    <text x="50" y="152" font-size="12.5" fill="#4a5568">• 在神经网络"冬天"（1969-1986）期间，是极少数从未放弃神经网络的学者之一</text>

                    <text x="30" y="185" font-size="13.5" fill="#2d3748">📌 他完成了"从0到1"到"从1到N"的关键一跃</text>
                    <text x="50" y="207" font-size="12.5" fill="#4a5568">• Werbos 发明了"轮子"（反向传播），但把它埋在了一堆论文里</text>

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', from.x);
            line.setAttribute('y1', from.y);
            line.setAttribute('x2', to.x);
            line.setAttribute('y2', to.y);
            line.setAttribute('class', `edge ${def.type}`);
            const markerMap = {
                'edge-origin': 'url(#arrowOrigin)',
                'edge-early': 'url(#arrowEarly)',
                'edge-breakthrough': 'url(#arrowBreakthrough)',
                'edge-modern': 'url(#arrowModern)',
                'edge-heritage': 'url(#arrowHeritage)'
            };
            if (markerMap[def.type]) line.setAttribute('marker-end', markerMap[def.type]);
            edgesGroup.appendChild(line);
        });
    }
    drawEdges();

    // ========== 拖拽联动 ==========
    const container = document.getElementById('graphContainer');
    let isDragging = false, currentTarget = null, offsetX = 0, offsetY = 0, startX = 0, startY = 0;
    const initialPositions = new Map();

    document.querySelectorAll('.node-group').forEach(g => {
        const tr = g.getAttribute('transform');
        if (tr) initialPositions.set(g, tr);
    });

    function getCoords(e) {
        const rect = svg.getBoundingClientRect();
        const cx = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const cy = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        const vb = svg.viewBox.baseVal;
        return { x: cx * vb.width / rect.width, y: cy * vb.height / rect.height };
    }

    function onStart(e) {
        const target = e.target.closest('.node-group');
        if (!target) return;
        e.preventDefault();
        currentTarget = target;
        const tr = target.getAttribute('transform');
        const match = tr.match(/translate\(([^,]+),\s*([^)]+)\)/);
        if (match) { offsetX = parseFloat(match[1]); offsetY = parseFloat(match[2]); }
        else { offsetX = 0; offsetY = 0; }
        const coords = getCoords(e);
        startX = coords.x - offsetX; startY = coords.y - offsetY;
        isDragging = true;
        svg.style.cursor = 'grabbing';
    }

    function onMove(e) {
        if (!isDragging || !currentTarget) return;
        e.preventDefault();
        const coords = getCoords(e);
        currentTarget.setAttribute('transform', `translate(${coords.x - startX}, ${coords.y - startY})`);
        drawEdges();
    }

    function onEnd() { if (isDragging) { isDragging = false; currentTarget = null; svg.style.cursor = 'grab'; } }

    svg.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    svg.addEventListener('touchstart', onStart, { passive: false });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);

    svg.addEventListener('dblclick', () => {
        document.querySelectorAll('.node-group').forEach(g => {
            const init = initialPositions.get(g);
            if (init) g.setAttribute('transform', init);
        });
        drawEdges();
    });
    svg.style.cursor = 'grab';

    // ========== 模态框 ==========
    const modal = document.getElementById('modal');
    const modalClose = document.getElementById('modalClose');
    const modalLabel = document.getElementById('modalLabel');
    const modalNameEn = document.getElementById('modalNameEn');
    const modalNameCn = document.getElementById('modalNameCn');
    const modalYear = document.getElementById('modalYear');
    const modalMeta = document.getElementById('modalMeta');
    const modalBio = document.getElementById('modalBio');

    function openModal(key) {
        const data = people[key];
        if (!data) return;
        modalLabel.textContent = '🧬';
        modalLabel.style.background = data.color || '#8b5cf6';
        modalNameEn.textContent = data.nameEn;
        modalNameCn.textContent = data.nameCn;
        modalYear.textContent = data.year;
        modalMeta.textContent = data.meta || '';
        modalBio.innerHTML = data.bio || '<p>暂无详情</p>';
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() { modal.classList.remove('active'); document.body.style.overflow = ''; }

    document.querySelectorAll('.node-group').forEach(node => {
        node.addEventListener('click', function(e) {
            const key = this.dataset.person;
            if (key && people[key]) openModal(key);
        });
    });

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 人物关系图谱 · 完整姓名版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; user-select: none; }
        body { background: #f0f3f9; display: flex; justify-content: center; padding: 24px 16px; min-height: 100vh; }
        .container { max-width: 1400px; width: 100%; background: white; border-radius: 40px; box-shadow: 0 20px 50px rgba(0,20,40,0.12); padding: 24px 20px 40px; }
        h1 { font-size: 2rem; font-weight: 650; color: #0b1c33; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
        .subtitle { color: #3b4a5e; border-left: 4px solid #3b82f6; padding-left: 20px; margin-bottom: 18px; background: #f0f6ff; border-radius: 0 16px 16px 0; padding: 10px 22px; font-weight: 400; line-height: 1.6; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-bottom: 18px; padding: 8px 4px; }
        .legend { display: flex; flex-wrap: wrap; gap: 14px 28px; background: #f8fafc; padding: 8px 20px; border-radius: 60px; border: 1px solid #e2e8f0; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 500; color: #1e293b; }
        .legend-line { width: 28px; height: 3px; border-radius: 6px; }
        .legend-line.mentor { background: #7c3aed; }
        .legend-line.postdoc { background: #ec4899; }
        .legend-line.collab { background: #0ea5e9; }
        .legend-line.transfer { background: #f59e0b; }
        .legend-line.found { background: #10b981; }
        .legend-line.conflict { background: #ef4444; }
        .legend-line.influence { background: #8b5cf6; }
        .legend-line.champion { background: #f43f5e; }

        .graph-container { position: relative; width: 100%; height: 1050px; background: #fafcff; border-radius: 28px; border: 1px solid #e9edf4; overflow: hidden; touch-action: none; }
        #graphSvg { display: block; width: 100%; height: 100%; background: #fafcff; cursor: grab; }
        #graphSvg:active { cursor: grabbing; }

        .node-group { cursor: grab; }
        .node-group:active { cursor: grabbing; }
        .node-bg { fill: white; stroke: #dce3ef; stroke-width: 1.8; rx: 20; ry: 20; transition: stroke 0.2s, filter 0.2s; }
        .node-group:hover .node-bg { stroke: #3b82f6; filter: drop-shadow(0 4px 12px rgba(0,20,40,0.12)); }

        .avatar-label {
            font-size: 10px;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            letter-spacing: 0.2px;
        }

        .node-cn { font-weight: 600; font-size: 9.5px; fill: #0b1c33; text-anchor: middle; pointer-events: none; }
        .node-en { font-size: 7.5px; fill: #5e6f87; text-anchor: middle; pointer-events: none; }
        .node-title { font-size: 7px; fill: #8b5cf6; text-anchor: middle; pointer-events: none; font-weight: 500; }

        .edge { stroke-width: 2.5; fill: none; stroke-linecap: round; opacity: 0.8; }
        .edge-mentor { stroke: #7c3aed; stroke-dasharray: 6 5; }
        .edge-postdoc { stroke: #ec4899; stroke-dasharray: 4 6; }
        .edge-collab { stroke: #0ea5e9; stroke-dasharray: 4 4; }
        .edge-transfer { stroke: #f59e0b; stroke-dasharray: 8 6; }
        .edge-found { stroke: #10b981; stroke-dasharray: 4 5; }
        .edge-conflict { stroke: #ef4444; stroke-dasharray: 3 6; }
        .edge-influence { stroke: #8b5cf6; stroke-dasharray: 2 6; stroke-width: 2; }
        .edge-champion { stroke: #f43f5e; stroke-dasharray: 4 8; stroke-width: 2; }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 20, 40, 0.4);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            border-radius: 40px;
            padding: 32px 36px 36px 36px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            animation: modalFade 0.25s ease;
            overflow-y: auto;
            position: relative;
        }

        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.95) translateY(16px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: #f1f5f9;
            border: none;
            border-radius: 60px;
            width: 42px;
            height: 42px;
            font-size: 1.2rem;
            cursor: pointer;
            color: #1e293b;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .modal-close:hover { background: #e2e8f0; transform: rotate(90deg); }

        .modal-header {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 18px;
            padding-right: 50px;
        }

        .modal-label {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            flex-shrink: 0;
            color: white;
        }

        .modal-name {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0b1c33;
            line-height: 1.2;
        }

        .modal-name .cn {
            font-size: 1.1rem;
            font-weight: 400;
            color: #475569;
            margin-left: 10px;
        }
        .modal-name .en {
            font-size: 1rem;
            font-weight: 400;
            color: #6b7b93;
            margin-left: 8px;
        }

        .modal-meta {
            color: #475569;
            font-size: 0.95rem;
            margin-top: 2px;
        }

        .modal-bio {
            border-top: 1px solid #e9edf4;
            padding-top: 20px;
            line-height: 1.8;
            color: #1e293b;
            font-size: 0.95rem;
        }

        .modal-bio i { color: #2563eb; width: 24px; }
        .modal-bio .highlight { background: #fef9c3; padding: 0 4px; font-weight: 500; }
        .modal-bio .org { display: inline-block; background: #eef3fa; padding: 0 12px; border-radius: 30px; font-size: 0.8rem; font-weight: 500; }
        .modal-bio p { margin-bottom: 8px; }

        .modal-bio::-webkit-scrollbar { width: 6px; }
        .modal-bio::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .modal-bio::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @media (max-width:700px) {
            .container { padding:12px; }
            h1 { font-size:1.4rem; }
            .graph-container { height:800px; }
            .legend { gap:8px 16px; padding:6px 14px; }
            .modal { padding: 24px 20px; max-width: 100%; }
            .modal-header { flex-wrap: wrap; gap: 12px; }
            .modal-name { font-size: 1.3rem; }
            .modal-name .cn { font-size: 0.9rem; display: block; margin-left: 0; }
            .modal-name .en { font-size: 0.85rem; display: block; margin-left: 0; }
            .modal-label { width: 56px; height: 56px; font-size: 1.5rem; }
        }
    </style>
</head>

    function getNodeCenter(nodeId) {
        const g = document.querySelector(`.node-group[data-id="${nodeId}"]`);
        if (!g) return null;
        const tr = g.getAttribute('transform');
        const match = tr.match(/translate\(([^,]+),\s*([^)]+)\)/);
        if (!match) return null;
        return { x: parseFloat(match[1]), y: parseFloat(match[2]) };
    }

    function drawEdges() {
        edgesGroup.innerHTML = '';
        edgeDefinitions.forEach(def => {
            const from = getNodeCenter(def.from);
            const to = getNodeCenter(def.to);
            if (!from || !to) return;
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', from.x);
            line.setAttribute('y1', from.y);
            line.setAttribute('x2', to.x);
            line.setAttribute('y2', to.y);
            line.setAttribute('class', `edge ${def.type}`);
            if (def.marker) line.setAttribute('marker-end', def.marker);
            edgesGroup.appendChild(line);
        });
    }
    drawEdges();

    const container = document.getElementById('graphContainer');

        if (tr) initialPositions.set(g, tr);

    function getCoords(e) {
        const rect = svg.getBoundingClientRect();
        const cx = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const cy = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        const vb = svg.viewBox.baseVal;
        return { x: cx * vb.width / rect.width, y: cy * vb.height / rect.height };
    }

        currentTarget = target;
        const tr = target.getAttribute('transform');
        const match = tr.match(/translate\(([^,]+),\s*([^)]+)\)/);
        if (match) { offsetX = parseFloat(match[1]); offsetY = parseFloat(match[2]); }
        else { offsetX = 0; offsetY = 0; }
        const coords = getCoords(e);
        startX = coords.x - offsetX; startY = coords.y - offsetY;
        isDragging = true;
        svg.style.cursor = 'grabbing';
    }

    function onMove(e) {
        if (!isDragging || !currentTarget) return;
        e.preventDefault();
        const coords = getCoords(e);
        currentTarget.setAttribute('transform', `translate(${coords.x - startX}, ${coords.y - startY})`);
        drawEdges();
    }

    function onEnd() { if (isDragging) { isDragging = false; currentTarget = null; svg.style.cursor = 'grab'; } }

    svg.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    svg.addEventListener('touchstart', onStart, { passive: false });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);

    svg.addEventListener('dblclick', () => {
        document.querySelectorAll('.node-group').forEach(g => {
            const init = initialPositions.get(g);
            if (init) g.setAttribute('transform', init);
        });
        drawEdges();
    });
    svg.style.cursor = 'grab';

    // ========== 模态框 ==========
    const modal = document.getElementById('modal');
    const modalClose = document.getElementById('modalClose');
    const modalLabel = document.getElementById('modalLabel');
    const modalNameCn = document.getElementById('modalNameCn');
    const modalNameEn = document.getElementById('modalNameEn');
    const modalMeta = document.getElementById('modalMeta');
    const modalBio = document.getElementById('modalBio');

    function openModal(key) {
        const data = people[key];
        if (!data) return;
        modalLabel.textContent = data.cn.charAt(0) || '👤';
        modalLabel.style.background = data.color || '#3b82f6';
        modalNameCn.textContent = data.cn;
        modalNameEn.textContent = data.en;
        modalMeta.textContent = data.meta || '';
        modalBio.innerHTML = data.bio || '<p>暂无详情</p>';
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() { modal.classList.remove('active'); document.body.style.overflow = ''; }

    document.querySelectorAll('.node-group').forEach(node => {
        node.addEventListener('click', function(e) {
            const key = this.dataset.person;
            if (key && people[key]) openModal(key);
        });
    });

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>

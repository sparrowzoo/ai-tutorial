<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参数化 Smooth L1 — 双重置按钮</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f4f8;
            font-family: system-ui, 'Segoe UI', sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            padding: 25px 25px 35px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.07);
            text-align: center;
        }
        h2 { font-weight: 500; color: #1a202c; margin-top: 0; }
        .formula-box {
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 14px;
            border-left: 6px solid #3182ce;
            margin: 10px 0 15px 0;
            font-size: 1.2rem;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
        }
        .formula-box .katex-display { margin: 0.1em 0; text-align: center; }
        .formula-box .fallback-text {
            font-family: monospace;
            font-size: 1rem;
            color: #c53030;
        }
        .slider-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px 40px;
            background: #f7fafc;
            padding: 18px 20px;
            border-radius: 16px;
            margin: 12px 0 18px 0;
            border: 1px solid #e2e8f0;
        }
        .slider-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 180px;
            flex: 1 0 auto;
        }
        .slider-item label {
            font-weight: 600;
            font-size: 1rem;
            color: #2d3748;
            margin-bottom: 4px;
        }
        .slider-item .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2b6cb0;
            background: white;
            padding: 0 12px;
            border-radius: 20px;
            min-width: 50px;
            display: inline-block;
        }
        .slider-item input[type="range"] {
            width: 100%;
            max-width: 220px;
            margin: 6px 0;
            accent-color: #3182ce;
            cursor: pointer;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0 4px;
        }
        .status-ok { background: #c6f6d5; color: #276749; }
        .status-fail { background: #fed7d7; color: #9b2c2c; }

        .canvas-wrapper {
            position: relative;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 900 / 450;
            background: white;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 12px 0 6px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 8px 20px;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls .reset-init {
            background: #3182ce;
        }
        .controls .reset-init:hover { background: #2b6cb0; }
        .controls .reset-std {
            background: #38a169;
        }
        .controls .reset-std:hover { background: #2f855a; }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 12px 0 6px;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .note-box {
            margin-top: 16px;
            padding: 12px 18px;
            background: #ebf8ff;
            border-radius: 16px;
            border-left: 5px solid #2b6cb0;
            text-align: left;
            font-size: 0.95rem;
            color: #2d3748;
            line-height: 1.6;
        }
        hr { border: none; border-top: 1px solid #e2e8f0; margin: 12px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>📐 参数化 Smooth L1 — 公式与曲线同步变化</h2>

    <!-- 动态公式区域 -->
    <div class="formula-box" id="formulaDisplay"></div>

    <!-- 滑块面板 -->
    <div class="slider-panel">
        <div class="slider-item">
            <label>二次系数 (a) <span class="value" id="valA">1.00</span></label>
            <input type="range" id="sliderA" min="0.00" max="1.50" step="0.01" value="1.00">
            <span style="font-size:0.8rem; color:#718096;">（标准 0.50）</span>
        </div>
        <div class="slider-item">
            <label>平移常数 (b) <span class="value" id="valB">0.00</span></label>
            <input type="range" id="sliderB" min="-1.50" max="0.50" step="0.01" value="0.00">
            <span style="font-size:0.8rem; color:#718096;">（标准 -0.50）</span>
        </div>
    </div>

    <!-- 状态提示 -->
    <div style="margin-bottom: 10px; font-size:0.95rem;">
        <span>连续：<span id="statusCont" class="status-badge status-fail">✘ 断裂</span></span>
        <span style="margin-left:20px;">光滑（一阶导数连续）：<span id="statusSmooth" class="status-badge status-fail">✘ 不成立（尖角）</span></span>
    </div>

    <!-- 画布 -->
    <div class="canvas-wrapper">
        <canvas id="chart" width="900" height="450"></canvas>
    </div>

    <!-- 控制区：两个重置按钮 -->
    <div class="controls">
        <button id="resetInitBtn" class="reset-init">⟲ 重置为初始 (a=1, b=0)</button>
        <button id="resetStdBtn" class="reset-std">★ 重置为标准 (a=0.5, b=-0.5)</button>
    </div>

    <div class="legend">
        <span><span style="display:inline-block; width:20px; height:4px; background:#2b6cb0; border-radius:4px;"></span> 当前</span>
        <span><span style="display:inline-block; width:20px; height:4px; background:#e53e3e; border-radius:4px;"></span> 标准 Smooth L1 (a=0.5, b=-0.5)</span>
        <span><span style="display:inline-block; width:20px; border-top:2px dashed #718096;"></span> 分段边界 </span>
    </div>

    <div class="note-box">
        <strong>🧪 试试看：</strong><br>
        • 初始状态 (a=1, b=0)：曲线在 (x=1) 处左侧斜率为 2，右侧斜率为 1，形成尖角（不光滑），且左右值不相等（不连续）。<br>
        • 点击 <strong>“重置为标准”</strong> 一键切换为标准 Smooth L1（红色虚线），此时蓝色曲线完全重合，连续且光滑。<br>
        • 调节滑块，观察公式和曲线实时变化，理解参数对连续性和光滑性的影响。
    </div>
</div>

<script>
    // ---------- 参数：默认 a=1, b=0 ----------
    const params = { a: 1.00, b: 0.00 };

    // ---------- Canvas 固定视图 ----------
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');
    const W = 900, H = 450;
    const margin = { top: 25, bottom: 40, left: 50, right: 25 };
    const plotW = W - margin.left - margin.right;
    const plotH = H - margin.top - margin.bottom;
    const xMin = -3.2, xMax = 3.2;
    const yMin = -0.8, yMax = 3.2;

    function mapX(x) { return margin.left + ((x - xMin) / (xMax - xMin)) * plotW; }
    function mapY(y) { return margin.top + plotH - ((y - yMin) / (yMax - yMin)) * plotH; }

    // ---------- 绘图 ----------
    function draw() {
        const a = params.a;
        const b = params.b;
        ctx.clearRect(0, 0, W, H);

        // 网格
        ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 0.8; ctx.setLineDash([4,4]);
        for (let x = -3; x <= 3; x += 1) {
            if (Math.abs(x) < 1e-9) continue;
            const px = mapX(x);
            ctx.beginPath(); ctx.moveTo(px, margin.top); ctx.lineTo(px, H - margin.bottom); ctx.stroke();
            ctx.fillStyle = "#4a5568"; ctx.font = "12px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="top";
            ctx.fillText(x.toString(), px, H - margin.bottom + 5);
        }
        for (let y = 0; y <= 3; y += 0.5) {
            if (Math.abs(y) < 1e-9) continue;
            const py = mapY(y);
            ctx.beginPath(); ctx.moveTo(margin.left, py); ctx.lineTo(W - margin.right, py); ctx.stroke();
            ctx.fillStyle = "#4a5568"; ctx.textAlign="right"; ctx.textBaseline="middle";
            ctx.fillText(y.toFixed(1), margin.left - 10, py);
        }

        // 坐标轴
        ctx.setLineDash([]); ctx.strokeStyle = "#1a202c"; ctx.lineWidth = 1.8;
        const y0 = mapY(0);
        ctx.beginPath(); ctx.moveTo(margin.left, y0); ctx.lineTo(W - margin.right, y0); ctx.stroke();
        ctx.fillStyle = "#1a202c";
        ctx.beginPath(); ctx.moveTo(W - margin.right, y0); ctx.lineTo(W - margin.right-8, y0-4); ctx.lineTo(W - margin.right-8, y0+4); ctx.fill();
        ctx.font = "14px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
        ctx.fillText("残差 x", W - margin.right - 15, y0 - 8);

        const x0 = mapX(0);
        ctx.beginPath(); ctx.moveTo(x0, margin.top); ctx.lineTo(x0, H - margin.bottom); ctx.stroke();
        ctx.fillStyle = "#1a202c";
        ctx.beginPath(); ctx.moveTo(x0, margin.top); ctx.lineTo(x0-4, margin.top+8); ctx.lineTo(x0+4, margin.top+8); ctx.fill();
        ctx.font = "14px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "top";
        ctx.fillText("损失值", x0 + 14, margin.top + 2);

        // ---- 标准版（红色虚线，固定 a=0.5, b=-0.5） ----
        function drawStandard() {
            ctx.strokeStyle = "#e53e3e"; ctx.lineWidth = 2.2; ctx.setLineDash([4, 6]);
            ctx.beginPath();
            let first = true;
            const step = 0.005;
            for (let x = xMin; x <= xMax; x += step) {
                let absX = Math.abs(x);
                let y = absX < 1 ? 0.5 * x * x : absX - 0.5;
                const px = mapX(x), py = mapY(y);
                if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
            }
            ctx.stroke();
        }
        drawStandard();

        // ---- 当前参数版（蓝色实线） ----
        function drawCurrent() {
            ctx.strokeStyle = "#2b6cb0"; ctx.lineWidth = 3.5; ctx.setLineDash([]);
            ctx.beginPath();
            let first = true;
            const step = 0.005;
            for (let x = xMin; x <= xMax; x += step) {
                let absX = Math.abs(x);
                let y = absX < 1 ? a * x * x : absX + b;
                const px = mapX(x), py = mapY(y);
                if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
            }
            ctx.stroke();
        }
        drawCurrent();

        // ---- 边界虚线 ----
        ctx.setLineDash([6, 6]); ctx.strokeStyle = "#718096"; ctx.lineWidth = 1.8;
        [1, -1].forEach(v => {
            const px = mapX(v);
            ctx.beginPath(); ctx.moveTo(px, margin.top); ctx.lineTo(px, H - margin.bottom); ctx.stroke();
        });

        // ---- 标注 x=1 处的左右值和斜率 ----
        const p1x = mapX(1);
        const leftVal = a;
        const rightVal = 1 + b;
        const leftDeriv = 2 * a;
        const rightDeriv = 1;

        ctx.setLineDash([]);
        ctx.font = "bold 13px sans-serif";
        // 左值点
        ctx.fillStyle = "#2b6cb0";
        ctx.beginPath(); ctx.arc(p1x, mapY(leftVal), 5, 0, 2*Math.PI); ctx.fill();
        ctx.fillStyle = "#2b6cb0"; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
        ctx.fillText(`左值 a=${a.toFixed(2)}`, p1x + 6, mapY(leftVal));
        // 右值点
        ctx.fillStyle = "#e53e3e";
        ctx.beginPath(); ctx.arc(p1x, mapY(rightVal), 5, 0, 2*Math.PI); ctx.fill();
        ctx.fillStyle = "#e53e3e"; ctx.textAlign = "left"; ctx.textBaseline = "top";
        ctx.fillText(`右值 1+b=${rightVal.toFixed(2)}`, p1x + 6, mapY(rightVal));
        // 导数
        ctx.font = "12px sans-serif";
        ctx.fillStyle = "#2b6cb0";
        ctx.textAlign = "right"; ctx.textBaseline = "bottom";
        ctx.fillText(`左导 ${leftDeriv.toFixed(2)}`, mapX(0.7), mapY(leftVal + 0.2));
        ctx.fillStyle = "#e53e3e";
        ctx.textAlign = "left"; ctx.textBaseline = "bottom";
        ctx.fillText(`右导 ${rightDeriv.toFixed(2)}`, mapX(1.15), mapY(rightVal + 0.2));

        // ---- 更新状态标签 ----
        const contOk = Math.abs(a - (1 + b)) < 0.001;
        const smoothOk = Math.abs(2*a - 1) < 0.001;
        document.getElementById('statusCont').textContent = contOk ? '✔ 成立' : '✘ 断裂';
        document.getElementById('statusCont').className = `status-badge ${contOk ? 'status-ok' : 'status-fail'}`;
        document.getElementById('statusSmooth').textContent = smoothOk ? '✔ 成立' : '✘ 不成立（尖角）';
        document.getElementById('statusSmooth').className = `status-badge ${smoothOk ? 'status-ok' : 'status-fail'}`;
    }

    // ---------- 更新公式显示（动态显示当前参数） ----------
    function updateFormula() {
        const a = params.a;
        const b = params.b;
        const el = document.getElementById('formulaDisplay');
        const latex = `
            f_{a,b}(x) =
            \\begin{cases}
            ${a.toFixed(2)} \\cdot x^2, & |x| < 1 \\\\
            |x| + ${b.toFixed(2)}, & |x| \\ge 1
            \\end{cases}
            \\quad
            \\text{当前：} a = ${a.toFixed(2)}, \\; b = ${b.toFixed(2)}
        `;
        try {
            // 尝试用 KaTeX 渲染
            katex.render(latex, el, {
                displayMode: true,
                throwOnError: false
            });
        } catch (e) {
            // 如果渲染失败，显示纯文本备用
            el.innerHTML = `<span class="fallback-text">f_{a,b}(x) = ... (a=${a.toFixed(2)}, b=${b.toFixed(2)})</span>`;
        }
        // 更新滑块旁边的数值显示
        document.getElementById('valA').textContent = a.toFixed(2);
        document.getElementById('valB').textContent = b.toFixed(2);
    }

    // ---------- 滑块事件 ----------
    document.getElementById('sliderA').addEventListener('input', function() {
        params.a = parseFloat(this.value);
        updateFormula();
        draw();
    });
    document.getElementById('sliderB').addEventListener('input', function() {
        params.b = parseFloat(this.value);
        updateFormula();
        draw();
    });

    // ---------- 重置为初始 (a=1, b=0) ----------
    document.getElementById('resetInitBtn').addEventListener('click', function() {
        document.getElementById('sliderA').value = '1.00';
        document.getElementById('sliderB').value = '0.00';
        params.a = 1.00;
        params.b = 0.00;
        updateFormula();
        draw();
    });

    // ---------- 重置为标准 (a=0.5, b=-0.5) ----------
    document.getElementById('resetStdBtn').addEventListener('click', function() {
        document.getElementById('sliderA').value = '0.50';
        document.getElementById('sliderB').value = '-0.50';
        params.a = 0.50;
        params.b = -0.50;
        updateFormula();
        draw();
    });

    // ---------- 初始化 ----------
    updateFormula();
    draw();
    window.addEventListener('resize', draw);
</script>
</body>
</html>
